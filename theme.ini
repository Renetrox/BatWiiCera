COLORSCHEME=./_inc/colors/classic.xml
LAYOUT=16:9
[layout]
type=select
label=FORMATO DE PANTALLA
apply_to=layout
values=16:9|Panorámico (16:9),4:3|Clásico (4:3)

[layout_16:9]
theme=./layouts/16:9/theme.xml

[layout_4:3]
theme=./layouts/4:3/theme.xml

[colors]
type=select
label=COLOR SCHEME
apply_to=theme_ini
key=COLORSCHEME
values=./_inc/colors/classic.xml|Classic Grey,./_inc/colors/sky.xml|Sky Blue,./_inc/colors/dark.xml|Dark Grey
default=./_inc/colors/classic.xml
